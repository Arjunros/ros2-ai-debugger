[build-system]
requires = ["setuptools>=59"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ros: needs a sourced ROS 2 environment (rclpy)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
"ros2_ai_debugger/analyzers/ai_prompt.py" = ["E501"]  # the prompt text is one long literal
