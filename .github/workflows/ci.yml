name: CI
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]' anthropic httpx2
      - run: ruff check .
      # Live ROS tests skip themselves when rclpy is unavailable.
      - run: pytest -q
