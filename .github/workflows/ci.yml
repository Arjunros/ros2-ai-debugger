name: CI
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]' anthropic httpx2
      - run: ruff check .
      # Live ROS tests skip themselves when rclpy is unavailable.
      - run: pytest -q

  ros:
    name: ROS 2 ${{ matrix.distro }} (colcon + live tests)
    runs-on: ubuntu-latest
    container: ros:${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pytest python3-colcon-common-extensions \
            ros-${{ matrix.distro }}-rclpy ros-${{ matrix.distro }}-tf2-msgs \
            ros-${{ matrix.distro }}-diagnostic-msgs ros-${{ matrix.distro }}-lifecycle-msgs \
            ros-${{ matrix.distro }}-controller-manager-msgs ros-${{ matrix.distro }}-example-interfaces \
            ros-${{ matrix.distro }}-sensor-msgs ros-${{ matrix.distro }}-geometry-msgs
      - name: Build with colcon
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          mkdir -p /ws/src && cp -r . /ws/src/ros2_ai_debugger
          cd /ws && colcon build --packages-select ros2_ai_debugger
      - name: Unit + live tests
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          source /ws/install/setup.bash
          ros2 ai version
          ros2 ai doctor || true
          cd /ws/src/ros2_ai_debugger
          export REQUIRE_ROS=1
          python3 -m pytest -q -rs -p no:cacheprovider
